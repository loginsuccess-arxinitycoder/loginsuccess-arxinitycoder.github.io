<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Math Edu</title>
    <style>
        /* Reset margins, paddings, and manage overflow to ensure zero scrollbars on the parent wrapper */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        /* Full-screen iframe container */
        .iframe-container {
            width: 100vw;
            height: 100vh;
            border: 0;
            margin: 0;
            padding: 0;
            display: block;
        }

        /* Styling for the iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe 
            src="https://learnmathedu.lovable.app/" 
            title="Learn Math Edu Application"
            allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            loading="lazy">
        </iframe>
    </div>
</body>
</html>
